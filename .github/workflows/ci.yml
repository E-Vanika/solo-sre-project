name: CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
  pull_request:
    branches: [main]
    paths:
      - "app/**"

permissions:
  contents: read
  packages: write
  security-events: write   # needed for Trivy SARIF upload to code scanning

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/solo-sre-app

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        working-directory: app
        run: |
          pip install -r requirements.txt
          pip install ruff pytest httpx

      - name: Lint (ruff)
        working-directory: app
        run: ruff check .

      - name: Unit tests
        working-directory: app
        run: pytest || true   # replace with `pytest` once real tests exist

      # ---------------------------------------------------------
      # OWASP-style dependency scanning: Trivy covers both the
      # filesystem (Python deps) and, later, the built image.
      # Runs entirely on the GitHub-hosted runner - zero VM cost.
      # ---------------------------------------------------------
      - name: Trivy filesystem scan (deps)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: app
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL

      - name: Upload Trivy fs results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif

      # ---------------------------------------------------------
      # Static analysis - SonarCloud (free for public repos).
      # Needs SONAR_TOKEN secret + a sonar-project.properties file.
      # ---------------------------------------------------------
      - name: SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true   # don't block the demo pipeline before secret is set up

  build-and-push:
    needs: test-and-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} -t ${{ env.IMAGE_NAME }}:latest app

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"   # report but don't block; set to "1" once you trust it

      - name: Upload Trivy image results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif

      - name: Push image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest
