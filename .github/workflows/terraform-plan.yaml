name: Terraform Plan

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:

  terraform-plan:

    name: Terraform Plan

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # TERRAFORM
      # ======================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ======================================================
      # TERRAFORM FORMAT
      # ======================================================

      - name: Terraform Format Check
        working-directory: ./playground-infrastructure-setup
        run: terraform fmt -check -recursive

      - name: Create temporary OCI private key
        shell: bash
        run: |
          set -euo pipefail

          printf '%s\n' "${{ secrets.OCI_PRIVATE_KEY }}" \
            > "${{ runner.temp }}/oci_api_key.pem"

          chmod 600 "${{ runner.temp }}/oci_api_key.pem"
      - name: Terraform Init - Remote OCI State
        working-directory: ./playground-infrastructure-setup

        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY_PATH: ${{ runner.temp }}/oci_api_key.pem
          OCI_REGION: ${{ secrets.OCI_REGION }}

        shell: bash

        run: |
          set -euo pipefail

          terraform init -upgrade \
            -backend-config="tenancy_ocid=${OCI_TENANCY_OCID}" \
            -backend-config="user_ocid=${OCI_USER_OCID}" \
            -backend-config="fingerprint=${OCI_FINGERPRINT}" \
            -backend-config="private_key_path=${OCI_PRIVATE_KEY_PATH}"

      # ======================================================
      # TERRAFORM VALIDATE
      # ======================================================

      - name: Terraform Validate
        working-directory: ./playground-infrastructure-setup
        env:
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_private_key_path: ${{ github.workspace }}/../.oci/oci_api_key.pem
          TF_VAR_region: ${{ secrets.OCI_REGION }}
          TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}

        run: |
          terraform validate

      # ======================================================
      # TERRAFORM PLAN
      # ======================================================

      - name: Terraform Plan
        working-directory: ./playground-infrastructure-setup

        env:
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_private_key_path: ${{ runner.temp }}/oci_api_key.pem
          TF_VAR_region: ${{ secrets.OCI_REGION }}
          TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_allowed_ssh_cidr: ${{ secrets.ALLOWED_SSH_CIDR }}

        shell: bash

        run: |
          set -euo pipefail

          terraform plan \
            -input=false \
            -out=tfplan

      # ======================================================
      # UPLOAD PLAN
      # ======================================================

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4

        with:
          name: terraform-plan-${{ github.sha }}
          path: ./playground-infrastructure-setup/tfplan
          retention-days: 7