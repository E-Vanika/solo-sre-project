name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy new image to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd /opt/sre-portfolio

            # remember last-known-good tag for rollback
            CURRENT=$(grep '^IMAGE_TAG=' .env 2>/dev/null | cut -d= -f2 || echo "latest")
            echo "$CURRENT" > .last_good_tag

            NEW_TAG="${{ github.sha }}"
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$NEW_TAG/" .env || echo "IMAGE_TAG=$NEW_TAG" >> .env

            docker compose pull app
            docker compose up -d --no-deps app

            # Health check through Caddy (port 80), not the app
            # container directly - "app" has no host port mapping by
            # design (only reachable from other containers on the
            # "internal" Docker network), so localhost:8000 on the VM
            # itself was never reachable. Checking through Caddy also
            # exercises the real path a user actually takes.
            #
            # Retry loop instead of one fixed sleep - a freshly
            # recreated container needs a moment for uvicorn to bind,
            # and a single 5s guess is fragile.
            HEALTHY=false
            for i in 1 2 3 4 5; do
              sleep 3
              if curl -fsS http://localhost/health; then
                HEALTHY=true
                break
              fi
              echo "Health check attempt $i failed, retrying..."
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "Health check failed after retries, rolling back to $CURRENT"
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$CURRENT/" .env
              docker compose pull app
              docker compose up -d --no-deps app
              exit 1
            fi
            echo "Deploy of $NEW_TAG succeeded"
