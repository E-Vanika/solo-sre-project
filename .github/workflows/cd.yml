name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  NEW_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
  BASE_URL: https://solo-sre-pg.duckdns.org

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy new image to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_KEY }}
          envs: NEW_TAG
          script: |
            set -e
            cd /opt/sre-portfolio

            CURRENT=$(grep '^IMAGE_TAG=' .env 2>/dev/null | cut -d= -f2 || true)
            CURRENT=${CURRENT:-latest}
            echo "$CURRENT" > .last_good_tag

            set_tag() {
              if grep -q '^IMAGE_TAG=' .env 2>/dev/null; then
                sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$1/" .env
              else
                echo "IMAGE_TAG=$1" >> .env
              fi
            }
            roll() {
              docker compose pull app app-2 greeting-service
              docker compose up -d --no-deps app app-2 greeting-service
            }

            set_tag "$NEW_TAG"
            roll

            HEALTHY=false
            for i in $(seq 1 10); do
              sleep 3
              if curl -fsS -o /dev/null http://localhost/readyz; then
                HEALTHY=true
                break
              fi
              echo "Readiness attempt $i failed, retrying..."
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "Not ready after retries, rolling back to $CURRENT"
              set_tag "$CURRENT"
              roll
              exit 1
            fi
            echo "Deploy of $NEW_TAG succeeded"

