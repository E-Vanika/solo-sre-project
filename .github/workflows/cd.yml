name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy new image to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd /opt/sre-portfolio

            CURRENT=$(grep '^IMAGE_TAG=' .env 2>/dev/null | cut -d= -f2 || echo "latest")
            echo "$CURRENT" > .last_good_tag

            NEW_TAG="${{ github.sha }}"
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$NEW_TAG/" .env || echo "IMAGE_TAG=$NEW_TAG" >> .env

            docker compose pull app app-2 greeting-service
            docker compose up -d --no-deps app app-2 greeting-service

            HEALTHY=false
            for i in 1 2 3 4 5; do
              sleep 3
              if curl -fsS http://localhost/health; then
                HEALTHY=true
                break
              fi
              echo "Health check attempt $i failed, retrying..."
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "Health check failed after retries, rolling back to $CURRENT"
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$CURRENT/" .env
              docker compose pull app app-2 greeting-service
              docker compose up -d --no-deps app app-2 greeting-service
              exit 1
            fi
            echo "Deploy of $NEW_TAG succeeded"

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify the live public endpoint post-deploy
        run: |
          set -e
          echo "Checking public health endpoint..."
          curl -fsS https://solo-sre-pg.duckdns.org/health

          echo "Checking landing page renders..."
          curl -fsS https://solo-sre-pg.duckdns.org/ | grep -q "Solo-SRE"

          echo "Checking /slow responds 200..."
          STATUS=$(curl -fsS -o /dev/null -w "%{http_code}" https://solo-sre-pg.duckdns.org/slow)
          [ "$STATUS" = "200" ]

          echo "All smoke checks passed."