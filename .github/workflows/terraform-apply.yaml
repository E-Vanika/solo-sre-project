name: Terraform Apply

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-apply
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    environment:
      name: terraform-production

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Terraform
      # ------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ------------------------------------------------------
      # OCI authentication
      # ------------------------------------------------------

      - name: Configure OCI credentials
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$OCI_PRIVATE_KEY" \
            > "$HOME/.oci/oci_api_key.pem"

          chmod 600 "$HOME/.oci/oci_api_key.pem"

      # ------------------------------------------------------
      # Terraform Init
      # ------------------------------------------------------

      - name: Terraform Init
        working-directory: ./playground-infrastructure-setup
        run: terraform init

      # ------------------------------------------------------
      # Terraform Validate
      # ------------------------------------------------------

      - name: Terraform Validate
        working-directory: ./playground-infrastructure-setup
        run: terraform validate

      # ------------------------------------------------------
      # Terraform Apply
      # ------------------------------------------------------

      - name: Terraform Apply
        working-directory: ./playground-infrastructure-setup
        env:
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_private_key_path: ${{ runner.temp }}/oci_api_key.pem
          TF_VAR_region: ${{ secrets.OCI_REGION }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_allowed_ssh_cidr: ${{ secrets.ALLOWED_SSH_CIDR }}
        shell: bash
        run: |
          printf '%s\n' '${{ secrets.OCI_PRIVATE_KEY }}' \
            > "$RUNNER_TEMP/oci_api_key.pem"

          chmod 600 "$RUNNER_TEMP/oci_api_key.pem"

          terraform apply \
            -auto-approve \
            -input=false