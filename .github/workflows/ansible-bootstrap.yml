name: Ansible Bootstrap VM

# Run manually, once, right after terraform-apply creates/recreates the VM.
# Everything runs on the GitHub-hosted runner - it SSHes out to the VM,
# nothing needs to be installed on your laptop.
on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: pip install ansible

      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Run playbook
        working-directory: ansible
        run: |
          echo "[vm]" > inventory.ini
          echo "e2micro ansible_host=${{ secrets.VM_HOST }} ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa" >> inventory.ini
          ansible-playbook -i inventory.ini playbook.yml

      - name: Create app directory + copy runtime files
        run: |
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            docker-compose.yml caddy/Caddyfile \
            ubuntu@${{ secrets.VM_HOST }}:/opt/solo-sre/
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -r \
            vmagent scripts \
            ubuntu@${{ secrets.VM_HOST }}:/opt/solo-sre/
