# Runs entirely on the e2.micro. Memory limits are deliberate -
# total budget kept under ~500MB to leave headroom for the OS,
# SSH, and swap on a 1GB instance.
#
# CURRENT_IMAGE_TAG is written by the CD pipeline / rollback script
# to control exactly which image version is running.

services:
  app:
    image: ghcr.io/${GHCR_OWNER}/cloud-playground:${IMAGE_TAG:-latest}
    container_name: app
    restart: unless-stopped
    mem_limit: 120m
    memswap_limit: 240m
    expose:
      - "8000"
    networks:
      - internal
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Second replica of the same image - this is the load-balancing
  # demo. Caddy round-robins between app and app-2 by default (no
  # lb_policy needed for basic round-robin).
  app-2:
    image: ghcr.io/${GHCR_OWNER}/solo-sre-app:${IMAGE_TAG:-latest}
    container_name: app-2
    restart: unless-stopped
    mem_limit: 120m
    memswap_limit: 240m
    expose:
      - "8000"
    networks:
      - internal
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Small second service that /greet calls - the actual hop that
  # makes distributed tracing meaningful instead of theoretical.
  greeting-service:
    build: ./app/greeting_service
    container_name: greeting-service
    restart: unless-stopped
    mem_limit: 60m
    expose:
      - "8001"
    networks:
      - internal
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}

  caddy:
    # build: ./caddy   # use this locally / in CI to get the rate-limit plugin
    image: caddy:2-alpine   # swap for your custom-built + pushed image once ready
    container_name: caddy
    restart: unless-stopped
    mem_limit: 60m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      - app

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    mem_limit: 30m
    command:
      - '--path.rootfs=/host'
    networks:
      - internal
    pid: host
    volumes:
      - /:/host:ro,rslave

  # vmagent scrapes local targets (app + node-exporter) and remote_writes
  # to a free-tier hosted metrics backend (Grafana Cloud / VictoriaMetrics
  # Cloud free tier). This is the key resource-budget decision: we do NOT
  # run Prometheus + Grafana locally - storage and dashboards live off-box.
  vmagent:
    image: victoriametrics/vmagent:latest
    container_name: vmagent
    restart: unless-stopped
    mem_limit: 60m
    networks:
      - internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./vmagent/scrape.yml:/etc/vmagent/scrape.yml
      - vmagent_data:/vmagentdata
    command:
      - '--promscrape.config=/etc/vmagent/scrape.yml'
      - '--remoteWrite.url=${REMOTE_WRITE_URL}'
      - '--remoteWrite.basicAuth.username=${REMOTE_WRITE_USER}'
      - '--remoteWrite.basicAuth.password=${REMOTE_WRITE_PASSWORD}'

networks:
  internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  vmagent_data:
