services:
  app:
    image: ghcr.io/${GHCR_OWNER}/cloud-playground:${IMAGE_TAG:-latest}
    container_name: app
    restart: unless-stopped
    mem_limit: 120m
    memswap_limit: 240m
    expose:
      - "8000"
    networks:
      - internal
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  app-2:
    image: ghcr.io/${GHCR_OWNER}/cloud-playground:${IMAGE_TAG:-latest}
    container_name: app-2
    restart: unless-stopped
    mem_limit: 120m
    memswap_limit: 240m
    expose:
      - "8000"
    networks:
      - internal
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  greeting-service:
    image: ghcr.io/${GHCR_OWNER}/cloud-playground-greeting:${IMAGE_TAG:-latest}
    container_name: greeting-service
    restart: unless-stopped
    mem_limit: 60m
    expose:
      - "8001"
    networks:
      - internal
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    mem_limit: 60m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      - app

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    mem_limit: 30m
    command:
      - '--path.rootfs=/host'
    networks:
      - internal
    pid: host
    volumes:
      - /:/host:ro,rslave

  vmagent:
    image: victoriametrics/vmagent:latest
    container_name: vmagent
    restart: unless-stopped
    mem_limit: 60m
    networks:
      - internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./vmagent/scrape.yml:/etc/vmagent/scrape.yml
      - vmagent_data:/vmagentdata
    command:
      - '--promscrape.config=/etc/vmagent/scrape.yml'
      - '--remoteWrite.url=${REMOTE_WRITE_URL}'
      - '--remoteWrite.basicAuth.username=${REMOTE_WRITE_USER}'
      - '--remoteWrite.basicAuth.password=${REMOTE_WRITE_PASSWORD}'

networks:
  internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  vmagent_data: